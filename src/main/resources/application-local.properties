# A local run (./gradlew bootRun starts this profile, on http://localhost:8080): readable console logs instead
# of JSON, and more detail from this project's own code. The database and every other setting still come from
# their environment variables (DB_HOST, DB_PORT, ... read by config/Settings.java): never put them here. With a
# database, compose.yaml has a local one (docker compose up -d): its first lines give the values to set
logging.level.com.ai2dev.bustravelaccounts=DEBUG
# HTTP on port 8080 through Spring Boot's Tomcat (build.gradle.kts: developmentOnly), not the Lambda container's
# own web server, which listens on no port
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration
