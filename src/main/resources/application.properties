server.port=${SERVER_PORT:8080}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/db_name}
spring.datasource.username=${JDBC_DATABASE_USERNAME:user}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=sp-testingHikariPool
logging.level.root=INFO
