spring.main.banner-mode=off
# Unknown paths reach the exception handler as NoHandlerFoundException (no static resources)
spring.web.resources.add-mappings=false
# Beans are created on first use: a database or secret that can't be reached fails only the
# requests that need it (as in Mule), not the start of the whole function; shorter cold start.
# With SnapStart: no secret and no database connection is ever in the snapshot (they are made after the
# restore); the web stack is created before it by the priming request (config/SnapStartHooks.java)
spring.main.lazy-initialization=true
# OpenAPI (springdoc): /v3/api-docs and /swagger-ui are off — the API's description is never served. For a local
# run turn them on with the env vars SPRINGDOC_API_DOCS_ENABLED=true and SPRINGDOC_SWAGGER_UI_ENABLED=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# Profiles: "aws" inside Lambda (StreamLambdaHandler starts it; JSON logs, application-aws.properties),
# "local" for a local run (readable logs, application-local.properties)
spring.servlet.multipart.strict-servlet-compliance=true
