# Inside AWS Lambda: StreamLambdaHandler starts Spring with this profile
# JSON logs (Logstash format): one CloudWatch event per entry, the stack trace included, and the
# correlation and request ids of RequestLoggingFilter as fields
logging.structured.format.console=logstash
# The Lambda container's own access line repeats RequestLoggingFilter's line (with "null" fields)
logging.level.com.amazonaws.serverless.proxy.internal.LambdaContainerHandler=WARN
