plugins {
    id 'java'
    id 'io.micronaut.application' version '4.0.0'
}

group = 'randomnumberlambda'
version = '0.1'
sourceCompatibility = '17'

micronaut {
    version "4.0.0" // ✅ Explicitly set Micronaut version
    runtime "lambda_java" // ✅ Correct runtime for AWS Lambda in Micronaut 4.x
    testRuntime "junit5"
    processing {
        incremental true
        annotations "randomnumberlambda.*"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor "io.micronaut:micronaut-inject-java"
    implementation "io.micronaut:micronaut-runtime"
    implementation "io.micronaut.aws:micronaut-function-aws:4.0.0"
    implementation "io.micronaut.aws:micronaut-function-aws-api-proxy:4.0.0"
    implementation "com.amazonaws:aws-lambda-java-core:1.2.1"
    implementation "com.amazonaws:aws-lambda-java-events:3.11.0"
    implementation "jakarta.annotation:jakarta.annotation-api:2.1.1"
}

application {
    mainClass.set("Randomnumberlambda.Application")
}

tasks.named("jar") {
    manifest {
        attributes(
            "Main-Class": "io.micronaut.function.aws.runtime.MicronautLambdaRuntime"
        )
    }
}

tasks.register("shadowJar", Jar) {
    archiveClassifier.set("all")
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

