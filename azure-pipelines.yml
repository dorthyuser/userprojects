trigger:
- '*'

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '8.0.x'
- script: dotnet restore PrimeNumberService.sln
  displayName: Restore
- script: dotnet build PrimeNumberService.sln --configuration Release --no-restore
  displayName: Build
