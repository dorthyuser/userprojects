name: Java Gradle + Docker + ACI Deploy

on:
  push:
    branches:
      - main-java-lambda

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login (Service Principal)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Give permission to scripts
      - name: Set execute permissions
        run: |
          chmod +x docker-build.sh
          chmod +x azure-container-instance.sh

      - name: Build and Push Docker Image
        run: |
          ./java-docker-build.sh \
            travelcard \
            ${{ secrets.DOCKER_USERNAME }} \
            ${{ secrets.DOCKER_PASSWORD }} \
            latest \
            17

      - name: Deploy to ACI
        run: |
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
          DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }} \
          ./azure-container-instance.sh \
            travelcard-api \
            ${{ secrets.DOCKER_USERNAME }}/travelcard \
            latest \
            <RESOURCE_GROUP> \
            8080
