name: CSharp Docker + Azure Container Instance
on:
  push:
    branches:
      - zoho-project-1
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # 3. Set permissions
      - name: Set execute permissions
        run: |
          chmod +x csharp-docker-build.sh
          chmod +x azure-container-instance.sh
      # 4. Build & Push Docker Image
      - name: Build and Push Docker Image
        run: |
          ./csharp-docker-build.sh \
            travelcard \
            ${{ secrets.DOCKER_USERNAME }} \
            ${{ secrets.DOCKER_PASSWORD }} \
            ${{ github.sha }} \
            8.0
          echo "Verifying image availability..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/travelcard:${{ github.sha }}
      - name: Wait for image availability
        run: sleep 15
      # 5. Deploy to Azure Container Instance
      - name: Deploy to ACI
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ZOHO_CLIENT_ID: ${{ secrets.AZ_ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.AZ_ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.AZ_ZOHO_REFRESH_TOKEN }}
          ZOHO_TOKEN_URL: https://accounts.zoho.in/oauth/v2/token
          ZOHO_BASE_URL: https://www.zohoapis.in
        run: |    
          ./azure-container-instance.sh \
            travelcard-api \
            ${{ secrets.DOCKER_USERNAME }}/travelcard \
            ${{ github.sha }} \
            dev-luffy \
            8080
