name: CSharp Docker + Azure Container Instance
on:
  push:
    branches:
      - zoho-project-csharp
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # 3. Set permissions
      - name: Set execute permissions
        run: |
          chmod +x csharp-docker-build.sh
          chmod +x azure-container-instance.sh
      # 4. Build & Push Docker Image
      - name: Build and Push Docker Image
        run: |
          ./csharp-docker-build.sh \
            travelcard \
            ${{ secrets.DOCKER_USERNAME }} \
            ${{ secrets.DOCKER_PASSWORD }} \
            ${{ github.sha }} \
            8.0
          echo "Verifying image availability..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/travelcard:${{ github.sha }}
      - name: Wait for image availability
        run: sleep 15
      # 5. Deploy to Azure Container Instance
      - name: Deploy to ACI
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          #  REQUIRED for Key Vault
          AZURE_KEY_VAULT: ${{ secrets.AZURE_KEY_VAULT }}
        run: |
          ./azure-container-instance.sh \
          travelcard-api-3 \
          ${{ secrets.DOCKER_USERNAME }}/travelcard \
          ${{ github.sha }} \
          dev-luffy \
          8080
