name: CSharp Docker + Azure Container Instance
on:
  push:
    branches:
      - zoho-crm-oauth-final-1
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # 3. Set permissions
      - name: Set execute permissions
        run: |
          chmod +x csharp-docker-build.sh
          chmod +x azure-container-instance.sh
      # 4. Build & Push Docker Image
      - name: Build and Push Docker Image
        run: |
          ./csharp-docker-build.sh \
            travelcard \
            ${{ secrets.DOCKER_USERNAME }} \
            ${{ secrets.DOCKER_PASSWORD }} \
            ${{ github.sha }} \
            8.0
          echo "Verifying image availability..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/travelcard:${{ github.sha }}
      - name: Wait for image availability
        run: sleep 15
      # 5. Deploy to Azure Container Instance
     - name: Deploy to ACI
     run: |
      DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
      DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }} \
      AZURE_KEY_VAULT=${{ secrets.AZURE_KEY_VAULT }} \
      ZOHO-CLIENT-ID=${{ secrets.ZOHO_CLIENT_ID_KEY }} \
      ZOHO-CLIENT-SECRET=${{ secrets.ZOHO_CLIENT_SECRET_KEY }} \
      ZOHO-REFRESH-TOKEN=${{ secrets.ZOHO_REFRESH_TOKEN_KEY }} \
      ZOHO_TOKEN_URL=https://accounts.zoho.in/oauth/v2/token \
      ZOHO_BASE_URL=https://www.zohoapis.in \
      ./azure-container-instance.sh \
        travelcard-api \
        ${{ secrets.DOCKER_USERNAME }}/travelcard \
        ${{ github.sha }} \
        dev-luffy \
        8080
