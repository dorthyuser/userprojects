name: Java Spring Boot Docker + Azure Container Instance

on:
  push:
    branches:
      - zoho-project-2

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Set permissions
      - name: Set execute permissions
        run: |
          chmod +x .github/scripts/docker-build.sh
          chmod +x .github/scripts/deployment.sh

      # 4. Build & Push Docker Image
      - name: Build and Push Docker Image
        run: |
          .github/scripts/docker-build.sh \
            springboottravelcardapi \
            ${{ secrets.DOCKER_USERNAME }} \
            ${{ secrets.DOCKER_PASSWORD }} \
            ${{ github.sha }} \
            21

      # 5. Verify image
      - name: Verify image availability
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/springboottravelcardapi:${{ github.sha }}

      - name: Wait for image availability
        run: sleep 15

      # 6. Deploy to Azure Container Instance
      - name: Deploy to ACI
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
        run: |
          .github/scripts/deployment.sh \
            springboottravelcardapi \
            ${{ secrets.DOCKER_USERNAME }}/springboottravelcardapi \
            ${{ github.sha }} \
            ${{ secrets.AZURE_RG_NAME }} \
            8080