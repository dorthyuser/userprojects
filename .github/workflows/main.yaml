name: Python FastAPI Docker + Azure Container Instance

on:
  push:
    branches:
      - '**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Set execute permissions
      - name: Set execute permissions
        run: |
          chmod +x .github/scripts/docker-build.sh
          chmod +x .github/scripts/deployment.sh

      # 4. Slugify branch name (replaces / and _ with -, max 40 chars)
      - name: Slugify branch name
        id: slug
        run: |
          echo "branch=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '_' '-' | cut -c1-40)" >> $GITHUB_OUTPUT

      # 5. Build & Push Docker Image
      - name: Build and Push Docker Image
        run: |
          .github/scripts/docker-build.sh \
            pythonadverseae1039 \
            ${{ secrets.DOCKER_USERNAME }} \
            ${{ secrets.DOCKER_PASSWORD }} \
            ${{ github.sha }} \
            3.13

      # 6. Verify image availability
      - name: Verify image availability
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/pythonadverseae1039:${{ github.sha }}

      # 7. Wait for Docker Hub propagation
      - name: Wait for image availability
        run: sleep 15

      # 8. Deploy to Azure Container Instance
      - name: Deploy to ACI
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
        run: |
          .github/scripts/deployment.sh \
            ${{ steps.slug.outputs.branch }} \
            ${{ secrets.DOCKER_USERNAME }}/pythonadverseae1039 \
            ${{ github.sha }} \
            ${{ secrets.AZURE_RG_NAME }} \
            8080
