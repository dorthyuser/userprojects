name: AWS Lambda CI/CD - Java

on:
  push:
    branches:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Setup Gradle — provides the `gradle` binary used by deployment.sh
      # to generate gradlew when the repo doesn't include it
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Install required packages
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq

      # Give execute permission
      - name: Make deployment script executable
        run: chmod +x .github/scripts/deployment.sh

      # Build & Deploy Lambda
      - name: Deploy Lambda
        run: |
          ./.github/scripts/deployment.sh \
            ${{ github.ref_name }} \
            https://github.com/${{ github.repository }}.git \
            ${{ github.ref_name }} \
            java21 \
            ${{ secrets.AWS_REGION }} \
            ${{ secrets.LAMBDA_ROLE_ARN }} \
            ${{ secrets.AWS_SECRET_NAME }}