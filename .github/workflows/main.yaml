name: AWS Lambda CI/CD - Java Spring Boot (migrated from MuleSoft)

# The function runs behind API Gateway (REST API, Lambda proxy integration). This workflow builds the
# function's .zip with the project's own Gradle wrapper and deploys it; API Gateway invokes the function.
#
# Pinned for reproducible, safe deploys: the runner image by version (ubuntu-latest moves between Ubuntu
# releases), every action by its full commit SHA with its release as a comment (a tag can be moved), and the
# Gradle wrapper JAR checked against Gradle's published checksums before it runs (gradle-wrapper.properties
# checks the Gradle download itself: distributionSha256Sum).

on:
  push:
    branches:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The wrapper JAR runs the build: it must be Gradle's own (a modified JAR fails the deploy here)
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The project's Java version (its Gradle toolchain asks for the same one)
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build and deploy the Lambda function
        run: |
          chmod +x ./gradlew .github/scripts/deployment.sh
          ./.github/scripts/deployment.sh \
            "${{ github.ref_name }}" \
            "java17.al2023" \
            "${{ secrets.AWS_REGION }}" \
            "${{ secrets.LAMBDA_ROLE_ARN }}" \
            "${{ secrets.AWS_SECRET_NAME }}"
