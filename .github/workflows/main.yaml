name: .NET Function CI/CD

on:
  push:
    branches:
      - 'Azfcsharp8'

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      # 4. Set execute permission
      - name: Make script executable
        run: chmod +x .github/scripts/deployment.sh

      # 5. Run your deployment script
      - name: Build & Deploy Azure Function
        env:
          # App settings the code reads, from the repo secret of the same name (added by the migration)
          APPSETTING_HTTPS_LISTENER_PATH: ${{ secrets.HTTPS_LISTENER_PATH }}
          APPSETTING_POSTGRESQL_USERNAME: ${{ secrets.POSTGRESQL_USERNAME }}
          APPSETTING_POSTGRESQL_PASSWORD: ${{ secrets.POSTGRESQL_PASSWORD }}
          APPSETTING_POSTGRESQL_HOST: ${{ secrets.POSTGRESQL_HOST }}
          APPSETTING_POSTGRESQL_PORT: ${{ secrets.POSTGRESQL_PORT }}
          APPSETTING_POSTGRESQL_DATABASE: ${{ secrets.POSTGRESQL_DATABASE }}
          APPSETTING_DB_HOST: ${{ secrets.DB_HOST }}
          APPSETTING_DB_PORT: ${{ secrets.DB_PORT }}
          APPSETTING_DB_NAME: ${{ secrets.DB_NAME }}
          APPSETTING_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          APPSETTING_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APPSETTING_AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
        run: |
          ./.github/scripts/deployment.sh \
            https://github.com/${{ github.repository }}.git \
            ${{ github.ref_name }} \
            ${{ secrets.AZURE_RG_NAME }} \
            ${{ secrets.AZURE_REGION }} \
            auto \
            8.0