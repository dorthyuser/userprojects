name: .NET Function CI/CD

on:
  push:
    branches:
      - 'azuresf1215'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      # 4. Set execute permission
      - name: Make script executable
        run: chmod +x .github/scripts/deployment.sh

      # 5. Run your deployment script
      - name: Build & Deploy Azure Function
        env:
          # App settings the code reads, from the repo secret of the same name (added by the migration)
          APPSETTING_Database__KeyVault: ${{ secrets.Database__KeyVault }}
          APPSETTING_Database__Username: ${{ secrets.Database__Username }}
          APPSETTING_Database__Password: ${{ secrets.Database__Password }}
          APPSETTING_Database__Host: ${{ secrets.Database__Host }}
          APPSETTING_Database__Dbname: ${{ secrets.Database__Dbname }}
          APPSETTING_Database__Port: ${{ secrets.Database__Port }}
          APPSETTING_Database__ResponseTimeoutMilliseconds: ${{ secrets.Database__ResponseTimeoutMilliseconds }}
        run: |
          ./.github/scripts/deployment.sh \
            https://github.com/${{ github.repository }}.git \
            ${{ github.ref_name }} \
            ${{ secrets.AZURE_RG_NAME }} \
            ${{ secrets.AZURE_REGION }} \
            auto \
            8.0 \
            "bustravel-sa-net8"