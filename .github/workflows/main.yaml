name: .NET Function CI/CD

on:
  push:
    branches:
      - "**"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      # 4. Set execute permission
      - name: Make script executable
        run: chmod +x .github/scripts/deployment.sh

      # 5. Run your deployment script
      - name: Build & Deploy Azure Function
        run: |
          ./.github/scripts/deployment.sh \
            https://github.com/${{ github.repository }}.git \
            ${{ github.ref_name }} \
            ${{ secrets.AZURE_RG_NAME }} \
            ${{ secrets.AZURE_REGION }} \
            mystorageaccountxyz \
            8.0
